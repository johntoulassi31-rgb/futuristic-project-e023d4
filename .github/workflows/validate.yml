name: Validate Mentoratplus
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - uses: denoland/setup-deno@v2
      - run: deno check supabase/functions/mentoratplus-api/index.ts
      - run: npm run check:server
      - run: npm test
      - run: npm run build
