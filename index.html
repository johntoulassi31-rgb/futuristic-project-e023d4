<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#171b32"/><title>Mentoratplus — Apprendre et construire son avenir</title><meta name="description" content="Votre tuteur pédagogique, vos quiz et votre parcours métier. Transformez vos idées en plans concrets et explorez toutes les disciplines."/><meta property="og:site_name" content="Mentoratplus"/><meta property="og:title" content="Mentoratplus — Apprendre et construire son avenir"/><meta property="og:description" content="Votre tuteur pédagogique, vos quiz et votre parcours métier. Transformez vos idées en plans concrets."/><link rel="icon" type="image/svg+xml" href="./favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet"/></head><body><div id="root"></div><script>
(function(){
  function showError(message){
    var root=document.getElementById('root');
    if(!root)return;
    root.innerHTML='';
    var box=document.createElement('main');
    box.style.cssText='min-height:100vh;box-sizing:border-box;padding:28px;font:16px/1.6 system-ui,sans-serif;color:#20243a;background:#f7f8fc';
    var title=document.createElement('h1');title.textContent='Mentoratplus — erreur de démarrage';
    var text=document.createElement('p');text.textContent='Le navigateur a rencontré une erreur avant de pouvoir afficher l’application :';
    var detail=document.createElement('pre');detail.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#fff;border:1px solid #ddd;border-radius:10px';detail.textContent=String(message||'Erreur inconnue');
    var help=document.createElement('p');help.textContent='Fais une capture de cet écran et envoie-la pour que nous corrigions précisément le problème.';
    box.append(title,text,detail,help);root.appendChild(box);
  }
  window.addEventListener('error',function(e){showError(e.message||e.error||'Erreur JavaScript');});
  window.addEventListener('unhandledrejection',function(e){showError(e.reason&&e.reason.message||e.reason||'Erreur réseau ou promesse rejetée');});
})();
</script><script type="module" src="/src/main.jsx"></script></body></html>
